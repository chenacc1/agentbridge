<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">AgentBridge scan-to-control flow</title><desc id="desc">Four steps: start AgentBridge on a computer, use phone command, scan QR in WeChat, and control the linked coding session from phone.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07142e"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/><text x="60" y="74" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">From local start to phone control</text><text x="60" y="106" font-family="Arial, sans-serif" font-size="17" fill="#bfdbfe">Every pairing is short-lived, single-use, and scoped to the selected local session.</text>
  <path d="M230 251H346M530 251H646M830 251H946" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/><path d="M346 251l-18-14m18 14l-18 14M646 251l-18-14m18 14l-18 14M946 251l-18-14m18 14l-18 14" stroke="#a78bfa" stroke-width="8" stroke-linecap="round"/>
  <g><circle cx="150" cy="251" r="78" fill="#122247" stroke="#38bdf8" stroke-width="3"/><text x="122" y="239" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7dd3fc">1</text><text x="150" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Start locally</text><text x="150" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">AgentBridge on PC</text></g>
  <g><circle cx="450" cy="251" r="78" fill="#172554" stroke="#818cf8" stroke-width="3"/><text x="422" y="239" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c4b5fd">2</text><text x="450" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Run /phone</text><text x="450" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">bind current session</text></g>
  <g><circle cx="750" cy="251" r="78" fill="#172554" stroke="#22d3ee" stroke-width="3"/><text x="722" y="239" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#67e8f9">3</text><text x="750" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Scan once</text><text x="750" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">WeChat opens H5</text></g>
  <g><circle cx="1050" cy="251" r="78" fill="#1e1b4b" stroke="#a78bfa" stroke-width="3"/><text x="1022" y="239" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ddd6fe">4</text><text x="1050" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">Control safely</text><text x="1050" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#cbd5e1">same event stream</text></g>
</svg>
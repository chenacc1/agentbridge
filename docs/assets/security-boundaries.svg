<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AgentBridge access boundaries</title><desc id="desc">The local computer keeps setup APIs and credentials local. Phones connect through a trusted LAN or private overlay network; a public tunnel requires a separate access key and one-time pairing.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09152d"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><text x="60" y="72" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">Access stays bounded by design</text><text x="60" y="104" font-family="Arial, sans-serif" font-size="17" fill="#bfdbfe">Local setup remains loopback-only. Remote access follows the mode you choose.</text>
  <g><rect x="60" y="158" width="320" height="330" rx="22" fill="#102244" stroke="#38bdf8" stroke-width="2"/><circle cx="112" cy="212" r="25" fill="#0e7490"/><path d="M102 212h20M112 202v20" stroke="#ecfeff" stroke-width="4"/><text x="150" y="219" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Local computer</text><text x="94" y="278" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#7dd3fc">Always local</text><text x="94" y="315" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">• Agent credentials</text><text x="94" y="346" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">• Child processes</text><text x="94" y="377" font-family="Arial, sans-serif" font-size="15" fill="#dbeafe">• Pairing bootstrap APIs</text><text x="94" y="432" font-family="Arial, sans-serif" font-size="14" fill="#a5f3fc">Loopback-only management surface</text></g>
  <g><rect x="440" y="158" width="320" height="330" rx="22" fill="#182554" stroke="#a78bfa" stroke-width="2"/><circle cx="492" cy="212" r="25" fill="#6d28d9"/><path d="M480 213l9 9 17-20" fill="none" stroke="#f5f3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="530" y="219" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Private remote</text><text x="474" y="278" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#c4b5fd">LAN · Tailscale · ZeroTier</text><text x="474" y="315" font-family="Arial, sans-serif" font-size="15" fill="#e0e7ff">• Phone reaches selected origin</text><text x="474" y="346" font-family="Arial, sans-serif" font-size="15" fill="#e0e7ff">• One-time QR pairing still required</text><text x="474" y="377" font-family="Arial, sans-serif" font-size="15" fill="#e0e7ff">• No router port forwarding</text><text x="474" y="432" font-family="Arial, sans-serif" font-size="14" fill="#ddd6fe">Trusted network membership required</text></g>
  <g><rect x="820" y="158" width="320" height="330" rx="22" fill="#2a1d3d" stroke="#f59e0b" stroke-width="2"/><circle cx="872" cy="212" r="25" fill="#b45309"/><path d="M864 212h16v15h-16zM868 211v-7a4 4 0 0 1 8 0v7" fill="none" stroke="#fffbeb" stroke-width="4" stroke-linejoin="round"/><text x="910" y="219" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Public tunnel</text><text x="854" y="278" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fcd34d">Cloudflare Tunnel option</text><text x="854" y="315" font-family="Arial, sans-serif" font-size="15" fill="#fef3c7">• HTTPS browser access</text><text x="854" y="346" font-family="Arial, sans-serif" font-size="15" fill="#fef3c7">• Separate shared access key</text><text x="854" y="377" font-family="Arial, sans-serif" font-size="15" fill="#fef3c7">• One-time QR pairing still required</text><text x="854" y="432" font-family="Arial, sans-serif" font-size="14" fill="#fde68a">Never expose port 8787 directly</text></g>
  <path d="M380 324H440M760 324H820" stroke="#64748b" stroke-width="5" stroke-dasharray="10 10"/><text x="514" y="525" font-family="Arial, sans-serif" font-size="15" fill="#cbd5e1">Device session cookies, command IDs, same-origin checks, and one input lease add further protection.</text>
</svg>
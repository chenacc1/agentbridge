<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AgentBridge local-first architecture</title><desc id="desc">A desktop computer runs AgentBridge and coding agent adapters. A paired phone connects through a one-time QR pairing link and shares the event stream.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#18244a"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#37d5ff"/><stop offset="1" stop-color="#9b7bff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/></filter></defs>
  <rect width="1200" height="640" rx="28" fill="url(#bg)"/><g opacity=".16" stroke="#a5b4fc"><path d="M0 110H1200M0 220H1200M0 330H1200M0 440H1200M0 550H1200"/><path d="M120 0V640M240 0V640M360 0V640M480 0V640M600 0V640M720 0V640M840 0V640M960 0V640M1080 0V640"/></g>
  <text x="64" y="72" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#f8fafc">AgentBridge · local-first phone control</text><text x="64" y="106" font-family="Arial, sans-serif" font-size="17" fill="#bfdbfe">Credentials and coding-agent processes remain on the computer.</text>
